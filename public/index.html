<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Meego · 把想法变成行动</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Meego 首页"><span class="brand-mark">m.</span>meego<span class="demo-tag">DEMO</span></a>
        <span class="local-note"><span class="status-dot"></span>仅保存在此浏览器</span>
      </header>
      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">A LITTLE FOCUS, EVERY DAY</p>
          <h1 id="page-title">把想法，变成行动<span>。</span></h1>
          <p class="subtitle">清空脑海里的待办，把注意力留给真正重要的事。</p>
        </section>
        <section class="stats" aria-label="任务统计">
          <article><span>全部任务</span><strong id="total-count">0</strong></article>
          <article><span>正在进行</span><strong id="active-count">0</strong></article>
          <article><span>已经完成</span><strong id="done-count">0</strong></article>
        </section>
        <section class="board" aria-labelledby="board-title">
          <div class="board-heading"><div><p class="eyebrow">YOUR WORKSPACE</p><h2 id="board-title">我的任务</h2></div><span class="small-note">从一件小事开始</span></div>
          <form id="task-form">
            <label class="sr-only" for="task-title">任务名称</label>
            <input id="task-title" name="title" maxlength="120" required placeholder="接下来，想完成什么？" autocomplete="off">
            <label class="sr-only" for="task-priority">优先级</label>
            <select id="task-priority" name="priority"><option value="normal">普通优先</option><option value="high">优先处理</option></select>
            <button class="add-button" type="submit">＋ 添加任务</button>
          </form>
          <div class="toolbar"><div class="filters" role="group" aria-label="筛选任务"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="active" aria-pressed="false">进行中</button><button type="button" data-filter="done" aria-pressed="false">已完成</button></div><span id="result-count" class="small-note" aria-live="polite">0 项任务</span></div>
          <p id="notice" class="notice" role="status" hidden></p>
          <ul id="task-list" aria-label="任务列表"></ul>
          <div id="empty-state" class="empty-state"><span class="empty-icon" aria-hidden="true">✓</span><h3 id="empty-title">给今天一个小目标</h3><p id="empty-description">添加第一项任务，让好想法开始发生。</p></div>
          <div class="board-footer"><span>慢慢来，每一步都算数。</span><span id="progress-text">完成进度 0%</span></div>
        </section>
      </main>
      <footer class="site-footer"><span>meego · 为专注留一点空间</span><span>简单开始，持续前进 ↗</span></footer>
    </div>
  </body>
</html>
